name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # `just` comes with the dev dependencies, so CI runs the same recipes as a developer.
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: just lint
      - name: Type check
        run: just typecheck
      - name: Test
        run: just test
      - name: Baselines
        if: matrix.python-version == '3.12'
        run: just baselines --report .artifacts/baselines/RESULTS_BASELINES.md
      - name: Upload artifacts
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: |
            .artifacts/coverage/
            .artifacts/baselines/
